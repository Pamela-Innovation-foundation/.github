name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  compatibility-build:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@3e377ecdf5d3018739e6e57c37e1dc80e9e48484 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  verify-compatibility-build:
    runs-on: ubuntu-latest
    needs: [compatibility-build]
    if: always()

    steps:
      - name: Confirm compatibility-build passed
        run: |
          echo "${{ needs.compatibility-build.result }}"
          test "${{ needs.compatibility-build.result }}" = "success"
