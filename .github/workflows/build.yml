name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  compatibility-build:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  verify-compatibility-build:
    runs-on: ubuntu-latest
    needs: [compatibility-build]
    if: always()

    steps:
      - name: Confirm compatibility-build passed
        run: |
          echo "${{ needs.compatibility-build.result }}"
          test "${{ needs.compatibility-build.result }}" = "success"
