name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']  # JavaScript analyzer handles both JS and TS files

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@42947a32f6b09390b6974ba2e5a2062e3e981a27 # v3.37.8
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@42947a32f6b09390b6974ba2e5a2062e3e981a27 # v3.37.8

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@42947a32f6b09390b6974ba2e5a2062e3e981a27 # v3.37.8
      with:
        category: "/language:${{matrix.language}}"