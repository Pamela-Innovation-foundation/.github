name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']  # JavaScript analyzer handles both JS and TS files

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Detect code scanning availability
      id: code-scanning
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        status=$(
          gh api "repos/${{ github.repository }}" \
            --jq '.security_and_analysis.code_scanning.status // "disabled"' \
            || echo "disabled"
        )
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Initialize CodeQL
      if: ${{ steps.code-scanning.outputs.status == 'enabled' }}
      uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      if: ${{ steps.code-scanning.outputs.status == 'enabled' }}
      uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

    - name: Perform CodeQL Analysis
      if: ${{ steps.code-scanning.outputs.status == 'enabled' }}
      uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
      with:
        category: "/language:${{matrix.language}}"
